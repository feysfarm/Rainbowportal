<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Mobile App UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/style.css">
</head>
<body>

  <div class="app-container">
    
    <button class="icon-btn home-btn" aria-label="Home Screen">Home</button>

    <button class="icon-btn inventory-btn" aria-label="Inventory">
      <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <polygon points="30,5 55,20 55,40 30,55 5,40 5,20" fill="#2a1a0a" stroke="#d4af37" stroke-width="3"/>
        <polygon points="30,12 48,22 48,38 30,48 12,38 12,22" fill="#8b0000" stroke="#ff4500" stroke-width="1.5"/>
        <path d="M30,18 L30,42 M22,25 L38,35 M38,25 L22,35" stroke="#ffaa00" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <button class="icon-btn settings-btn" aria-label="Settings">Settings</button>

    <div class="button-container" style="top: 50%; left: 50%;">
      <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/button-bg.png" alt="Button Background">
      <div class="button-text">Click Me Here</div>
    </div>
    
  </div>

</body>
</html>
