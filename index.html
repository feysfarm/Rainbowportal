<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 1. The Wrapper */
    .phone-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      border: 3px solid black; /* So you can see the container boundaries */
    }

    /* 2. The Background */
    .bg-image {
      width: 100%;
      display: block;
      height: auto;
    }

    .custom-btn {
  position: absolute;
  z-index: 999;
  width: 100px;  /* Match your button size */
  height: 50px;
  background: transparent; /* No background color or image here */
  border: none;
  padding: 0;   /* Remove default button padding */
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent; /* Removes the blue box flash on Android/iOS Chrome */
}

/* 2. The Visual Layer (This handles the image and the effects) */
.btn-visual {
  width: 100%;
  height: 100%;
  background-image: url('button-bg.png');
  background-size: 100% 100%;
  background-repeat: no-repeat;
  
  /* Text centering styling */
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  
  /* Smooth transition for the effect */
  transition: transform 0.1s ease, opacity 0.1s ease;
}

/* 3. The Interactive Effect */
/* When the parent button is pressed, ONLY the inner visual layer scales down */
.custom-btn:active .btn-visual {
  opacity: 0.85;
  transform: scale(0.92); /* Shrinks slightly within its transparent bounds */
}

    /* 4. The Curved Positions */
    .btn-1 { top: 20%; left: 10%; }
    .btn-2 { top: 35%; left: 25%; }
    .btn-3 { top: 50%; left: 35%; } 
  </style>
</head>
<body>

  <div class="phone-container">
    <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/background.jpg" class="bg-image" alt="Background">
    
    <button class="custom-btn btn-1"><div class="btn-visual">LED</div></button>
    <button class="custom-btn btn-2">Btn 2</button>
    <button class="custom-btn btn-3">Btn 3</button>
  </div>

</body>
</html>
