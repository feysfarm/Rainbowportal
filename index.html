<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 1. The Wrapper */
    .phone-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      border: 3px solid black; /* So you can see the container boundaries */
    }
 
    .bg-image {
      width: 100%;
      display: block;
      height: auto;
    }

    .custom-btn {
  position: absolute;
  z-index: 999;
  width: 100px;  /* Match your button size */
  height: 50px;
  background: transparent; /* No background color or image here */
  border: none;
  padding: 0;   /* Remove default button padding */
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent; /* Removes the blue box flash on Android/iOS Chrome */
}
 
.btn-visual {
  width: 100%;
  height: 70%;
  background-image: url('button-bg.png');
  background-size: 100% 100%;
  background-repeat: no-repeat;
   
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
   
  transition: transform 0.1s ease, opacity 0.1s ease;
}
 
.custom-btn:active .btn-visual {
  opacity: 0.85;
  transform: scale(0.92); /* Shrinks slightly within its transparent bounds */
}

.sparkle {
  position: absolute;
  width: 8px;
  height: 8px; 
  background-color: #ff0077; 
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  pointer-events: none;
  z-index: 1000; 
  box-shadow: 0 0 10px #fff, 0 0 15px #ffd700, 0 0 20px #ff8c00;
  
  /* Hook up the animation */
  animation: explode 0.6s ease-out forwards;
} 

/* The Burst Animation */
@keyframes explode {
  0% {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  100% {
    /* These CSS variables (--tx, --ty) will be set randomly by JavaScript */
    transform: translate(var(--tx), var(--ty)) scale(0);
    opacity: 0;
  }
}

    /* 4. The Curved Positions */
    .btn-1 { top: 20%; left: 10%; }
    .btn-2 { top: 35%; left: 25%; }
    .btn-3 { top: 50%; left: 35%; } 
  </style>
</head>
<body>

  <div class="phone-container">
    <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/background.jpg" class="bg-image" alt="Background">
    
    <button class="custom-btn btn-1" id="testbtn"><div class="btn-visual">LED</div></button> 
  </div>
</body>
<script>
function createSparkles(button) {
  const sparkleCount = 10; // Slightly increased for a better rainbow effect!

  for (let i = 0; i < sparkleCount; i++) {
    const sparkle = document.createElement('span');
    sparkle.classList.add('sparkle');

    // Position in the center of the button
    sparkle.style.left = '50%';
    sparkle.style.top = '50%';

    // Generate random explosion trajectories
    const targetX = (Math.random() - 0.5) * 130 + 'px';
    const targetY = (Math.random() - 0.5) * 130 + 'px';
    sparkle.style.setProperty('--tx', targetX);
    sparkle.style.setProperty('--ty', targetY);

    // Randomize size
    const size = Math.random() * 6 + 6 + 'px';
    sparkle.style.width = size;
    sparkle.style.height = size;

    // 🌈 THE COLOR MAGIC: Pick a random degree on the color wheel (0 - 360)
    const randomHue = Math.floor(Math.random() * 360);
    sparkle.style.filter = `hue-rotate(${randomHue}deg)`;

    // Append and clean up
    button.appendChild(sparkle);
    setTimeout(() => {
      sparkle.remove();
    }, 600);
  }
}

// INTEGRATION INTO YOUR EXISTING CODE:
function setupPressAndHold(buttonId) {
  const button = document.getElementById(buttonId);
  let pressTimer = null;
  let isHoldTriggered = false;

  button.addEventListener('pointerdown', (e) => {
    e.preventDefault(); 
    isHoldTriggered = false;

    // ✨ TRIGGER SPARKLES IMMEDIATELY UPON TOUCH ✨
    createSparkles(button);

    pressTimer = setTimeout(() => {
      isHoldTriggered = true;
      onButtonHold(buttonId);
    }, HOLD_DURATION);
  });

  button.addEventListener('pointerup', () => {
    clearTimeout(pressTimer);
    if (!isHoldTriggered) {
      onButtonTap(buttonId);
    }
  });

  button.addEventListener('pointerleave', () => {
    clearTimeout(pressTimer);
  });
}
setupPressAndHold("testbtn");
</script>
</html>
