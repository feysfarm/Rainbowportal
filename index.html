<!DOCTYPE html>
<html lang="en">

<head>
<link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/icon-192.png">
<link rel="manifest" href="/manifest.json" crossorigin="anonymous">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rainbow Speaker</title> 
  <style>
    :root {
      --bg: #0e1014;
      --card: rgba(255, 192, 203, 0.25); /* 🌟 UPDATED TO TRANSPARENT PINK */
      --accent: #4f8cff;
      --accent2: rgba(255, 255, 255, 0.15); /* 💡 PRO-TIP: Make buttons slightly transparent too! */
      --txt: #e8eaed;
      --mut: #8b909a;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--txt)
    }

    /* FIX: Added relative positioning and z-index so it sits cleanly over the background image */
    .wrap {
      position: relative;
      z-index: 2;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px
    }

    h1 {
      font-size: 20px;
      margin: 8px 0 14px
    }

    .card {
          background: var(--card);
          border-radius: 14px;
          padding: 16px;
          margin-bottom: 14px;
          
          /* 🪄 Adds a beautiful frosted blur to the background image behind the card */
          backdrop-filter: blur(10px); 
          -webkit-backdrop-filter: blur(10px); /* For Safari support */
        }

    .title {
      font-size: 17px;
      font-weight: 600;
      word-break: break-word;
      min-height: 22px
    }

    .mut {
      color: var(--mut);
      font-size: 13px;
      margin-bottom: 6px
    }

    .transport {
      display: flex;
      justify-content: center;
      gap: 16px;
      align-items: center;
      margin-top: 16px
    }

    button {
      font: inherit;
      color: var(--txt);
      border: none;
      background: var(--accent2);
      border-radius: 12px;
      cursor: pointer;
      padding: 0
    }

    /* Base styling for back and forward buttons */
    .tbtn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* Specific custom PNG assignments */
    .btn-prev {
      background-image: url('https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/backbtn.png');
      background-color: transparent; /* Removes fallback color if image asset handles it */
    }

    .btn-next {
      background-image: url('https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/forwardbtn.png');
      background-color: transparent;
    }

    /* Base styling for the Play/Pause button */
    .play {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-image: url('https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/playbtn.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent; 
      transition: transform 0.1s ease;
    }

    /* If your JS toggles a 'paused' class, this switches the image seamlessly */
    .play.paused {
      background-image: url('https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/pausebtn.png'); 
    }
    .transport button:active {
      transform: scale(0.95);
    }
    

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px
    }

    .row label {
      font-size: 13px;
      color: var(--mut);
      width: 52px
    }

    input[type=range] {
      flex: 1;
      accent-color: var(--accent)
    }

    .vval {
      width: 28px;
      text-align: right
    }

    .toggle {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px
    }

    .toggle.on {
      background: var(--accent)
    }

    .tk {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      background: var(--accent2);
      margin-bottom: 6px
    }

    .tk.active {
      outline: 2px solid var(--accent)
    }

    .tk .nm {
      flex: 1;
      font-size: 14px;
      word-break: break-word
    }

    .tk button {
      background: transparent;
      color: var(--accent);
      padding: 6px 10px;
      font-size: 13px
    }
  </style>

  <style>
    /* 1. The Wrapper */
   .phone-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      border: 3px solid black;
      border-radius: 16px; /* Optional: rounds container corners nicely */
      overflow: hidden;    /* Optional: clips the background to container bounds */
    }

    /* FIX: Made the image absolutely fill the container background layer */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Keeps aspect ratio clean while covering the container */
      z-index: 1;
    }

    .custom-btn {
  position: absolute;
  z-index: 999;
  width: 100px;  /* Match your button size */
  height: 25px;
  background: transparent; /* No background color or image here */
  border: none;
  padding: 0;   /* Remove default button padding */
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent; /* Removes the blue box flash on Android/iOS Chrome */
}
 
.btn-visual {
  width: 100%;
  height: 100%;
  background-image: url('button-bg.png');
  background-size: contain;
  background-repeat: no-repeat;
   
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
   
  transition: transform 0.1s ease, opacity 0.1s ease;
}
 
.custom-btn:active .btn-visual {
  opacity: 0.85;
  transform: scale(0.92); /* Shrinks slightly within its transparent bounds */
}

.sparkle {
      position: absolute;
      width: 12px;
      height: 12px; 
      pointer-events: none;
      z-index: 1000;  
      
      /* Glow is safe out here! */
      box-shadow: 0 0 10px var(--sparkle-color), 
                  0 0 20px var(--sparkle-color);
      filter: brightness(1.5);
      animation: explode 0.6s ease-out forwards;
    } 

    /* 3. The Actual Inner Star Shape */
    .sparkle-inner {
      width: 100%;
      height: 100%;
      background-color: #ffffff; /* White center */
      /* The shape is safely applied to the inner element */
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    /* The Burst Animation */
    @keyframes explode {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }

    /* 4. The Curved Positions */
    .btn-1 { top: 20%; left: 10%; }
    .btn-2 { top: 35%; left: 25%; }
    .btn-3 { top: 50%; left: 35%; } 
  </style>
</head>
<body>

  <div class="phone-container">
    <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/background.jpg" class="bg-image" alt="Background">
    
    <div class="wrap">
    <h1>Rainbow land!</h1>
    <div class="card">
    <div class="mut">Now playing</div>
    <div class="title" id="title">-</div>
    <div class="transport">
    <button class="tbtn btn-prev" onclick="api('prev')"></button>
    <button class="play" id="play" onclick="api('playpause')"></button>
    <button class="tbtn btn-next" onclick="api('next')"></button>
    </div>
    <div class="row"><label>Volume</label>
    <input type="range" id="vol" min="0" max="21" oninput="setVol(this.value)">
    <span class="vval" id="vval">0</span></div>
    <button class="toggle" id="stage" onclick="api('stage')">Stage</button>
    </div>
    <div class="card"><div class="mut">Library</div><div id="list"></div></div>
    </div>
    
    <button class="custom-btn btn-1" id="testbtn"><div class="btn-visual">LED</div></button> 
  </div>
</body>
<script>
function createSparkles(button) {
  const sparkleCount = 14; 

  const brightColors = [
    '#00ffff', // Neon Cyan
    '#ff00ff', // Neon Magenta
    '#00ff00', // Neon Green
    '#ff3300', // Neon Red/Orange
    '#ffea00', // Neon Yellow
    '#ff007f', // Bright Pink
    '#39ff14'  // Radioactive Green
  ];

  for (let i = 0; i < sparkleCount; i++) {
    // Create outer element (carries the trajectory and glow)
    const sparkle = document.createElement('span');
    sparkle.classList.add('sparkle');

    // Create inner element (carries the star cutout)
    const innerStar = document.createElement('div');
    innerStar.classList.add('sparkle-inner');
    sparkle.appendChild(innerStar);

    // Position center
    sparkle.style.left = '50%';
    sparkle.style.top = '50%';

    // Explosion trajectories
    const targetX = (Math.random() - 0.5) * 160 + 'px';
    const targetY = (Math.random() - 0.5) * 160 + 'px';
    sparkle.style.setProperty('--tx', targetX);
    sparkle.style.setProperty('--ty', targetY);

    // Randomize size
    const size = Math.random() * 8 + 8 + 'px';
    sparkle.style.width = size;
    sparkle.style.height = size;

    // Pick a vibrant color
    const randomColor = brightColors[Math.floor(Math.random() * brightColors.length)];
    sparkle.style.setProperty('--sparkle-color', randomColor);

    // Append and clean up
    button.appendChild(sparkle);
    setTimeout(() => {
      sparkle.remove();
    }, 600);
  }
}
// INTEGRATION INTO YOUR EXISTING CODE:
function setupPressAndHold(buttonId) {
  const button = document.getElementById(buttonId);
  let pressTimer = null;
  let isHoldTriggered = false;

  button.addEventListener('pointerdown', (e) => {
    //e.preventDefault(); 
    isHoldTriggered = false;

    // ✨ TRIGGER SPARKLES IMMEDIATELY UPON TOUCH ✨
    createSparkles(button);

    pressTimer = setTimeout(() => {
      isHoldTriggered = true;
      onButtonHold(buttonId);
    }, HOLD_DURATION);
  });

  button.addEventListener('pointerup', () => {
    clearTimeout(pressTimer);
    if (!isHoldTriggered) {
      onButtonTap(buttonId);
    }
  });

  button.addEventListener('pointerleave', () => {
    clearTimeout(pressTimer);
  });
}
setupPressAndHold("testbtn");
</script>
</html>
