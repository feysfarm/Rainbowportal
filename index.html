<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 1. The Wrapper */
    .phone-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      border: 3px solid black; /* So you can see the container boundaries */
    }
 
    .bg-image {
      width: 100%;
      display: block;
      height: auto;
    }

    .custom-btn {
  position: absolute;
  z-index: 999;
  width: 100px;  /* Match your button size */
  height: 25px;
  background: transparent; /* No background color or image here */
  border: none;
  padding: 0;   /* Remove default button padding */
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent; /* Removes the blue box flash on Android/iOS Chrome */
}
 
.btn-visual {
  width: 100%;
  height: 100%;
  background-image: url('button-bg.png');
  background-size: contain;
  background-repeat: no-repeat;
   
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
   
  transition: transform 0.1s ease, opacity 0.1s ease;
}
 
.custom-btn:active .btn-visual {
  opacity: 0.85;
  transform: scale(0.92); /* Shrinks slightly within its transparent bounds */
}

.sparkle {
      position: absolute;
      width: 12px;
      height: 12px; 
      pointer-events: none;
      z-index: 1000;  
      
      /* Glow is safe out here! */
      box-shadow: 0 0 10px var(--sparkle-color), 
                  0 0 20px var(--sparkle-color);
      filter: brightness(1.5);
      animation: explode 0.6s ease-out forwards;
    } 

    /* 3. The Actual Inner Star Shape */
    .sparkle-inner {
      width: 100%;
      height: 100%;
      background-color: #ffffff; /* White center */
      /* The shape is safely applied to the inner element */
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    /* The Burst Animation */
    @keyframes explode {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }

    /* 4. The Curved Positions */
    .btn-1 { top: 20%; left: 10%; }
    .btn-2 { top: 35%; left: 25%; }
    .btn-3 { top: 50%; left: 35%; } 
  </style>
</head>
<body>

  <div class="phone-container">
    <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/background.jpg" class="bg-image" alt="Background">
    
    <button class="custom-btn btn-1" id="testbtn"><div class="btn-visual">LED</div></button> 
  </div>
</body>
<script>
function createSparkles(button) {
  const sparkleCount = 14; 

  const brightColors = [
    '#00ffff', // Neon Cyan
    '#ff00ff', // Neon Magenta
    '#00ff00', // Neon Green
    '#ff3300', // Neon Red/Orange
    '#ffea00', // Neon Yellow
    '#ff007f', // Bright Pink
    '#39ff14'  // Radioactive Green
  ];

  for (let i = 0; i < sparkleCount; i++) {
    // Create outer element (carries the trajectory and glow)
    const sparkle = document.createElement('span');
    sparkle.classList.add('sparkle');

    // Create inner element (carries the star cutout)
    const innerStar = document.createElement('div');
    innerStar.classList.add('sparkle-inner');
    sparkle.appendChild(innerStar);

    // Position center
    sparkle.style.left = '50%';
    sparkle.style.top = '50%';

    // Explosion trajectories
    const targetX = (Math.random() - 0.5) * 160 + 'px';
    const targetY = (Math.random() - 0.5) * 160 + 'px';
    sparkle.style.setProperty('--tx', targetX);
    sparkle.style.setProperty('--ty', targetY);

    // Randomize size
    const size = Math.random() * 8 + 8 + 'px';
    sparkle.style.width = size;
    sparkle.style.height = size;

    // Pick a vibrant color
    const randomColor = brightColors[Math.floor(Math.random() * brightColors.length)];
    sparkle.style.setProperty('--sparkle-color', randomColor);

    // Append and clean up
    button.appendChild(sparkle);
    setTimeout(() => {
      sparkle.remove();
    }, 600);
  }
}
// INTEGRATION INTO YOUR EXISTING CODE:
function setupPressAndHold(buttonId) {
  const button = document.getElementById(buttonId);
  let pressTimer = null;
  let isHoldTriggered = false;

  button.addEventListener('pointerdown', (e) => {
    //e.preventDefault(); 
    isHoldTriggered = false;

    // ✨ TRIGGER SPARKLES IMMEDIATELY UPON TOUCH ✨
    createSparkles(button);

    pressTimer = setTimeout(() => {
      isHoldTriggered = true;
      onButtonHold(buttonId);
    }, HOLD_DURATION);
  });

  button.addEventListener('pointerup', () => {
    clearTimeout(pressTimer);
    if (!isHoldTriggered) {
      onButtonTap(buttonId);
    }
  });

  button.addEventListener('pointerleave', () => {
    clearTimeout(pressTimer);
  });
}
setupPressAndHold("testbtn");
</script>
</html>
