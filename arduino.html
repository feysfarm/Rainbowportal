<!DOCTYPE html>
<!--
  Sketch-ready Rainbowportal UI.
  Embed this file in PROGMEM (e.g. CONTROL_HTML); CSS, JS, and images load from jsDelivr.
-->
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/icon-192.png">
  <link rel="manifest" href="/manifest.json" crossorigin="anonymous">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Rainbow Speaker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/elementpositions.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/prototype.css">
</head>
<body>
  <div class="viewport">
    <div class="scene" id="scene">
      <img
        class="scene-bg"
        src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/Images/background.jpg"
        alt=""
        width="1080"
        height="1920"
        draggable="false"
      >

      <button type="button" class="balloon-btn balloonA" data-id="balloonA"
        style="--bob-duration:3.1s;--bob-delay:0s;--bob-amount:7px;--glow-color:rgba(255,170,210,0.3)"
        aria-label="Replay last list">
        <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/Images/balloonA.png" alt="">
        <span class="balloon-label">Replay last list</span>
      </button>

      <button type="button" class="balloon-btn balloonB" data-id="balloonB"
        style="--bob-duration:3.4s;--bob-delay:0.4s;--bob-amount:6px;--glow-color:rgba(170,220,255,0.3)"
        aria-label="Manage lists">
        <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/Images/balloonB.png" alt="">
        <span class="balloon-label">Manage lists</span>
      </button>

      <button type="button" class="balloon-btn balloonC" data-id="balloonC"
        style="--bob-duration:2.9s;--bob-delay:0.8s;--bob-amount:8px;--glow-color:rgba(180,255,200,0.28)"
        aria-label="Toggle stage">
        <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/Images/balloonC.png" alt="">
        <span class="balloon-label">Toggle stage</span>
      </button>

      <button type="button" class="balloon-btn balloonD" data-id="balloonD"
        style="--bob-duration:3.6s;--bob-delay:1.1s;--bob-amount:5px;--glow-color:rgba(255,220,150,0.3)"
        aria-label="Set sleep timer">
        <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/Images/balloonD.png" alt="">
        <span class="balloon-label">Set sleep timer</span>
      </button>

      <button type="button" class="balloon-btn balloonE" data-id="balloonE"
        style="--bob-duration:3.2s;--bob-delay:0.6s;--bob-amount:7px;--glow-color:rgba(220,180,255,0.3)"
        aria-label="Increase volume">
        <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/Images/balloonE.png" alt="">
        <span class="balloon-label">Increase volume</span>
      </button>

      <button type="button" class="balloon-btn balloonF" data-id="balloonF"
        style="--bob-duration:3.5s;--bob-delay:1.4s;--bob-amount:6px;--glow-color:rgba(255,200,230,0.28)"
        aria-label="Lower volume">
        <img src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/Images/balloonF.png" alt="">
        <span class="balloon-label">Lower volume</span>
      </button>

      <aside class="player-panel" aria-label="Audio player">
        <p class="player-now">Now playing</p>
        <p class="player-title" id="playerTitle">—</p>

        <div class="player-transport">
          <button type="button" class="player-btn player-prev" id="btnPrev" aria-label="Previous track"></button>
          <button type="button" class="player-btn player-play" id="btnPlay" aria-label="Play"></button>
          <button type="button" class="player-btn player-next" id="btnNext" aria-label="Next track"></button>
        </div>

        <div class="player-list-wrap">
          <p class="player-list-label">Library</p>
          <div class="player-list-scroll" id="trackList" role="listbox" aria-label="Song list"></div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/feysfarm/Rainbowportal@main/arduino.js"></script>
</body>
</html>
